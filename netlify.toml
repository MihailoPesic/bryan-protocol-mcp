"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "dist"
  command = "python3 scripts/build_web_bundle.py && npm run build:web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/archive.json.gz"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
