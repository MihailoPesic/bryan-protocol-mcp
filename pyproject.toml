[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bryan-protocol-mcp"
version = "0.1.0"
description = "Ground-truth knowledge base and Model Context Protocol (MCP) server for Bryan Johnson's Blueprint Protocol, videos, articles, and podcast interviews."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "MihailoPesic", email = "mikicasarajevo@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "bryan-johnson", "blueprint", "longevity", "knowledge-base"]
dependencies = []

[project.scripts]
bryan-protocol-mcp = "bryan_protocol_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
